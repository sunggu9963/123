<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>망연계 · 서버 관제</title>
  <style>
    :root{
      --bg:#0a0e13;
      --panel:#11161d;
      --panel-2:#161c25;
      --line:#232b36;
      --text:#e7ecf3;
      --text-dim:#7f8ba0;
      --text-faint:#4d586b;
      --ok:#35d68e;
      --ok-dim:#1b3d30;
      --bad:#ff5d6c;
      --bad-dim:#3d1f24;
      --warn:#ffb648;
      --warn-dim:#3a2c14;
      --accent:#5b8cff;
      /* 인터넷 접근이 없는 폐쇄망 환경을 고려해 웹폰트(CDN) 대신
         OS에 기본 내장된 폰트만으로 스택을 구성 (Win/macOS/Linux 공통 폴백) */
      --disp:'Segoe UI', 'Noto Sans KR', 'Malgun Gothic', -apple-system, sans-serif;
      --mono:'Consolas', 'D2Coding', 'Noto Sans Mono', 'Courier New', monospace;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      background:
        radial-gradient(1200px 500px at 15% -10%, rgba(91,140,255,0.08), transparent 60%),
        var(--bg);
      color:var(--text);
      font-family:var(--mono);
      min-height:100vh;
    }
    ::selection{background:var(--accent);color:#fff;}

    /* ---------- top bar ---------- */
    header{
      position:sticky;top:0;z-index:10;
      display:flex;align-items:center;justify-content:space-between;
      gap:16px;
      padding:18px 28px;
      background:rgba(10,14,19,0.85);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }
    .brand{display:flex;align-items:center;gap:12px;}
    .brand .dot{
      width:10px;height:10px;border-radius:50%;
      background:var(--ok);
      box-shadow:0 0 0 0 rgba(53,214,142,.6);
      animation:brandpulse 2.4s ease-out infinite;
    }
    @keyframes brandpulse{
      0%{box-shadow:0 0 0 0 rgba(53,214,142,.55);}
      70%{box-shadow:0 0 0 9px rgba(53,214,142,0);}
      100%{box-shadow:0 0 0 0 rgba(53,214,142,0);}
    }
    .brand h1{
      font-family:var(--disp);
      font-size:18px;font-weight:700;letter-spacing:.2px;margin:0;
    }
    .brand span{color:var(--text-dim);font-size:12px;font-family:var(--mono);}

    .toolbar{display:flex;align-items:center;gap:10px;}
    #search{
      background:var(--panel);border:1px solid var(--line);
      color:var(--text);padding:8px 12px;border-radius:6px;
      font-family:var(--mono);font-size:13px;width:220px;
      outline:none;transition:border-color .15s;
    }
    #search:focus{border-color:var(--accent);}
    #search::placeholder{color:var(--text-faint);}

    .clock{color:var(--text-dim);font-size:12px;min-width:150px;text-align:right;}

    /* ---------- summary strip ---------- */
    .summary{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:1px;
      background:var(--line);
      border-bottom:1px solid var(--line);
    }
    .summary .cell{
      background:var(--bg);
      padding:20px 28px;
    }
    .summary .cell .label{
      font-size:11px;letter-spacing:.08em;text-transform:uppercase;
      color:var(--text-faint);margin-bottom:8px;
    }
    .summary .cell .value{
      font-family:var(--disp);font-size:30px;font-weight:700;line-height:1;
    }
    .summary .cell .value.ok{color:var(--ok);}
    .summary .cell .value.bad{color:var(--bad);}
    .summary .cell .unit{font-size:14px;color:var(--text-dim);margin-left:4px;font-family:var(--mono);font-weight:400;}

    /* ---------- main grid ---------- */
    main{padding:24px 28px 60px;max-width:1400px;margin:0 auto;}
    .grid-title{
      display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;
    }
    .grid-title h2{
      font-family:var(--disp);font-size:14px;font-weight:500;
      color:var(--text-dim);letter-spacing:.04em;text-transform:uppercase;margin:0;
    }
    .grid-title .count{color:var(--text-faint);font-size:12px;}

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
      gap:14px;
    }

    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:10px;
      padding:18px;
      position:relative;
      overflow:hidden;
      transition:border-color .15s, transform .15s;
    }
    .card:hover{border-color:#2e3a49;}
    .card.offline{opacity:.62;}
    .card::before{
      content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    }
    .card.online::before{background:var(--ok);}
    .card.offline::before{background:var(--bad);}

    .card-head{
      display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;
    }
    .card-head h3{
      font-family:var(--disp);font-size:16px;font-weight:700;margin:0 0 3px;
      color:var(--text);word-break:break-all;
    }
    .card-head .ip{color:var(--text-dim);font-size:12px;}

    .badge{
      display:flex;align-items:center;gap:6px;
      font-size:11px;font-weight:700;letter-spacing:.06em;
      padding:4px 9px;border-radius:20px;white-space:nowrap;
    }
    .badge.online{background:var(--ok-dim);color:var(--ok);}
    .badge.offline{background:var(--bad-dim);color:var(--bad);}

    .heartbeat{width:16px;height:10px;flex:none;}
    .heartbeat path{
      fill:none;stroke:var(--ok);stroke-width:1.4;
      stroke-dasharray:24;stroke-dashoffset:24;
      animation:beat 1.8s linear infinite;
    }
    @keyframes beat{
      0%{stroke-dashoffset:24;}
      60%{stroke-dashoffset:0;}
      100%{stroke-dashoffset:-24;}
    }

    .metric-row{margin-bottom:10px;}
    .metric-row .metric-label{
      display:flex;justify-content:space-between;
      font-size:11px;color:var(--text-dim);margin-bottom:5px;
    }
    .metric-label b{color:var(--text);font-family:var(--mono);font-weight:700;}
    .bar-track{
      height:6px;border-radius:4px;background:#1c2330;overflow:hidden;
    }
    .bar-fill{height:100%;border-radius:4px;transition:width .4s ease;}
    .bar-fill.g{background:var(--ok);}
    .bar-fill.y{background:var(--warn);}
    .bar-fill.r{background:var(--bad);}

    .disk-list{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
    .disk-item{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:11px;}
    .disk-item .mp{width:72px;color:var(--text-dim);flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .disk-item .bar-track{flex:1;}
    .disk-item .pct{width:38px;text-align:right;flex:none;color:var(--text-dim);}

    .proc-list{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:6px;}
    .proc-pill{
      font-size:10.5px;padding:3px 8px;border-radius:5px;
      display:flex;align-items:center;gap:5px;
      background:var(--panel-2);color:var(--text-dim);border:1px solid var(--line);
    }
    .proc-pill .dot{width:6px;height:6px;border-radius:50%;flex:none;}
    .proc-pill.up .dot{background:var(--ok);}
    .proc-pill.down .dot{background:var(--bad);}
    .proc-pill.down{color:var(--bad);border-color:var(--bad-dim);}

    .db-metrics{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
    .db-metric-item{
      display:flex;justify-content:space-between;align-items:center;
      font-size:11px;margin-bottom:6px;gap:10px;
    }
    .db-metric-item:last-child{margin-bottom:0;}
    .db-metric-item .dmlabel{
      color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .db-metric-item .dmvalue{
      color:var(--accent);font-weight:700;font-family:var(--mono);
      flex:none;white-space:nowrap;
    }
    .db-metric-item .dmvalue.fail{color:var(--text-faint);font-weight:400;font-style:italic;}

    .card-foot{
      display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;
      border-top:1px solid var(--line);font-size:10.5px;color:var(--text-faint);
    }
    .card-foot .ttl.warn{color:var(--warn);}
    .foot-right{display:flex;align-items:center;gap:10px;}

    .btn-delete{
      background:transparent;border:1px solid var(--line);color:var(--text-faint);
      font-family:var(--mono);font-size:10px;letter-spacing:.03em;
      padding:3px 9px;border-radius:5px;cursor:pointer;
      transition:all .15s;
    }
    .btn-delete:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-dim);}
    .btn-delete:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
    .btn-delete:disabled{opacity:.4;cursor:not-allowed;}

    .empty{
      text-align:center;padding:80px 20px;color:var(--text-faint);
    }
    .empty .big{font-family:var(--disp);font-size:20px;color:var(--text-dim);margin-bottom:8px;}
    .empty code{color:var(--accent);background:var(--panel);padding:2px 6px;border-radius:4px;}

    /* ---------- drag & drop ---------- */
    .btn-reset{
      background:transparent;border:1px solid var(--line);color:var(--text-dim);
      font-family:var(--mono);font-size:12px;letter-spacing:.02em;
      padding:8px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;
      transition:all .15s;
    }
    .btn-reset:hover{border-color:var(--accent);color:var(--accent);}
    .btn-reset:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

    .drag-handle{
      display:flex;align-items:center;justify-content:center;
      width:20px;height:20px;flex:none;margin-right:2px;
      color:var(--text-faint);cursor:grab;border-radius:4px;
      transition:color .15s,background .15s;
    }
    .drag-handle:hover{color:var(--text-dim);background:var(--panel-2);}
    .drag-handle svg{width:12px;height:12px;pointer-events:none;}

    .card{cursor:default;}
    .card.dragging{
      opacity:.4;
      border-style:dashed;
      border-color:var(--accent);
    }
    .card.drag-over{
      border-color:var(--accent);
      box-shadow:0 0 0 1px var(--accent) inset;
    }
    .card.drag-over::after{
      content:'';position:absolute;inset:0;
      background:rgba(91,140,255,0.06);pointer-events:none;
    }

    .err-banner{
      background:var(--bad-dim);border:1px solid var(--bad);color:var(--bad);
      padding:10px 16px;border-radius:6px;font-size:12px;margin-bottom:16px;display:none;
    }

    @media (prefers-reduced-motion: reduce){
      .brand .dot, .heartbeat path{animation:none;}
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <div class="dot"></div>
    <h1>망연계</h1>
    <span>서버 상태 관제</span>
  </div>
  <div class="toolbar">
    <input id="search" type="text" placeholder="hostname 검색...">
    <button class="btn-reset" id="resetOrder" title="드래그로 바꾼 카드 배치를 원래대로 되돌립니다">배치 초기화</button>
    <a class="btn-reset" href="/logout" title="로그아웃" style="text-decoration:none;display:inline-block;">로그아웃</a>
    <div class="clock" id="clock">--:--:--</div>
  </div>
</header>

<section class="summary">
  <div class="cell">
    <div class="label">전체 서버</div>
    <div class="value" id="sTotal">–</div>
  </div>
  <div class="cell">
    <div class="label">Online</div>
    <div class="value ok" id="sOnline">–</div>
  </div>
  <div class="cell">
    <div class="label">Offline</div>
    <div class="value bad" id="sOffline">–</div>
  </div>
  <div class="cell">
    <div class="label">평균 CPU</div>
    <div class="value" id="sCpu">–<span class="unit">%</span></div>
  </div>
  <div class="cell">
    <div class="label">평균 메모리</div>
    <div class="value" id="sMem">–<span class="unit">%</span></div>
  </div>
</section>

<main>
  <div class="err-banner" id="errBanner">서버 목록을 불러오지 못했습니다. API 서버 연결 상태를 확인하세요.</div>

  <div class="grid-title">
    <h2>Servers</h2>
    <span class="count" id="gridCount"></span>
  </div>

  <div class="cards" id="cards"></div>

  <div class="empty" id="emptyState" style="display:none;">
    <div class="big">등록된 서버가 없습니다</div>
    <div>에이전트가 <code>POST /collect.do</code> 로 데이터를 전송하면 여기에 표시됩니다.</div>
  </div>
</main>

<script>
  const REFRESH_MS = 5000;
  const CPU_WARN = 80, CPU_BAD = 90;
  const MEM_WARN = 85, MEM_BAD = 95;
  const DISK_WARN = 80, DISK_BAD = 90;

  let allServers = [];

  // ---- 드래그로 바꾼 카드 배치를 브라우저에 저장/복원 ----
  const ORDER_KEY = 'mycollector.cardOrder';
  let customOrder = [];
  try {
    customOrder = JSON.parse(localStorage.getItem(ORDER_KEY) || '[]');
  } catch (e) {
    customOrder = [];
  }

  function applyCustomOrder(list){
    // 기본 정렬(ONLINE 우선 + hostname): 저장된 순서가 없거나,
    // 저장된 순서에 없는(새로 추가된) 서버를 뒤에 붙일 때 사용
    const defaultSorted = [...list].sort((a,b) => {
      if ((a.status==='ONLINE') !== (b.status==='ONLINE')) return a.status==='ONLINE' ? -1 : 1;
      return (a.hostname||'').localeCompare(b.hostname||'');
    });

    if (!customOrder.length) return defaultSorted;

    const byHost = new Map(list.map(s => [(s.hostname||'').toLowerCase(), s]));
    const used = new Set();
    const ordered = [];

    customOrder.forEach(h => {
      const s = byHost.get(h);
      if (s) { ordered.push(s); used.add(h); }
    });
    defaultSorted.forEach(s => {
      const h = (s.hostname||'').toLowerCase();
      if (!used.has(h)) ordered.push(s);
    });
    return ordered;
  }

  function saveCurrentOrderFromDom(){
    const cardsEl = document.getElementById('cards');
    // 검색 필터가 걸려 화면에 일부만 보이는 상태에서 드래그해도,
    // 화면에 없는(필터로 숨겨진) 서버의 순서 정보는 유지한 채 뒤에 붙여서 저장
    const visibleOrder = Array.from(cardsEl.querySelectorAll('.card')).map(c => c.dataset.hostname);
    const visibleSet = new Set(visibleOrder);
    const hiddenRemaining = customOrder.filter(h => !visibleSet.has(h));
    customOrder = [...visibleOrder, ...hiddenRemaining];
    localStorage.setItem(ORDER_KEY, JSON.stringify(customOrder));
  }

  function heartbeatSvg(){
    return `<svg class="heartbeat" viewBox="0 0 32 20"><path d="M0 10 H8 L11 3 L15 17 L18 10 H32"/></svg>`;
  }

  function barClass(v, warn, bad){
    if (v >= bad) return 'r';
    if (v >= warn) return 'y';
    return 'g';
  }

  function fmtTtl(sec){
    if (sec == null || sec < 0) return 'expired';
    const m = Math.floor(sec/60), s = sec%60;
    return m > 0 ? `${m}m ${s}s` : `${s}s`;
  }

  function serverCard(s){
    const online = s.status === 'ONLINE';
    const cpu = s.cpuUsage ?? 0, mem = s.memoryUsage ?? 0;

    const diskHtml = (s.diskUsages || []).map(d => {
      const u = d.usage ?? 0;
      return `
        <div class="disk-item">
          <div class="mp" title="${d.mountPoint ?? ''}">${d.mountPoint ?? '-'}</div>
          <div class="bar-track"><div class="bar-fill ${barClass(u, DISK_WARN, DISK_BAD)}" style="width:${Math.min(u,100)}%"></div></div>
          <div class="pct">${u.toFixed(0)}%</div>
        </div>`;
    }).join('');

    const procHtml = (s.processes || []).map(p => {
      const up = !!p.running;
      return `<div class="proc-pill ${up?'up':'down'}"><span class="dot"></span>${p.name}</div>`;
    }).join('');

    const dbMetricsHtml = (s.dbMetrics || []).map(m => {
      const failed = m.value == null;
      return `
        <div class="db-metric-item">
          <span class="dmlabel" title="${escapeAttr(m.label)}">${m.label ?? '-'}</span>
          <span class="dmvalue ${failed ? 'fail' : ''}">${failed ? '조회 실패' : m.value}</span>
        </div>`;
    }).join('');

    const ttl = s.remainingTtl;
    const ttlWarnClass = (online && ttl >= 0 && ttl < 15) ? 'warn' : '';

    return `
    <div class="card ${online ? 'online':'offline'}" data-hostname="${(s.hostname||'').toLowerCase()}" draggable="true">
      <div class="card-head">
        <div style="display:flex;align-items:flex-start;gap:6px;">
          <div class="drag-handle" title="드래그해서 순서 변경">
            <svg viewBox="0 0 12 12" fill="currentColor"><circle cx="3" cy="2" r="1.3"/><circle cx="9" cy="2" r="1.3"/><circle cx="3" cy="6" r="1.3"/><circle cx="9" cy="6" r="1.3"/><circle cx="3" cy="10" r="1.3"/><circle cx="9" cy="10" r="1.3"/></svg>
          </div>
          <div>
            <h3>${s.hostname ?? '-'}</h3>
            <div class="ip">${s.ip ?? '-'}</div>
          </div>
        </div>
        <div class="badge ${online?'online':'offline'}">
          ${online ? heartbeatSvg() : ''}
          ${online ? 'ONLINE' : 'OFFLINE'}
        </div>
      </div>

      <div class="metric-row">
        <div class="metric-label"><span>CPU</span><b>${cpu.toFixed(1)}%</b></div>
        <div class="bar-track"><div class="bar-fill ${barClass(cpu, CPU_WARN, CPU_BAD)}" style="width:${Math.min(cpu,100)}%"></div></div>
      </div>
      <div class="metric-row">
        <div class="metric-label"><span>Memory</span><b>${mem.toFixed(1)}%</b></div>
        <div class="bar-track"><div class="bar-fill ${barClass(mem, MEM_WARN, MEM_BAD)}" style="width:${Math.min(mem,100)}%"></div></div>
      </div>

      ${diskHtml ? `<div class="disk-list">${diskHtml}</div>` : ''}
      ${procHtml ? `<div class="proc-list">${procHtml}</div>` : ''}
      ${dbMetricsHtml ? `<div class="db-metrics">${dbMetricsHtml}</div>` : ''}

      <div class="card-foot">
        <span>${s.getLastSeenFormatted ?? formatTs(s.timestamp)}</span>
        <div class="foot-right">
          <span class="ttl ${ttlWarnClass}">TTL ${online ? fmtTtl(ttl) : '-'}</span>
          <button class="btn-delete" data-hostname="${escapeAttr(s.hostname)}" title="${escapeAttr(s.hostname)} 삭제">삭제</button>
        </div>
      </div>
    </div>`;
  }

  function escapeAttr(str){
    return String(str ?? '').replace(/"/g, '&quot;');
  }

  function formatTs(ts){
    if (!ts) return '-';
    const d = new Date(ts);
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function render(list){
    // 드래그 중에는 자동 새로고침(fetchData)이 카드 영역을 다시 그리지 않도록 건너뜀.
    // 최신 데이터(allServers)는 계속 갱신되고, 드래그가 끝나는 시점에 한 번에 반영됨.
    if (isDragging) {
      pendingRenderList = list;
      return;
    }

    const cardsEl = document.getElementById('cards');
    const emptyEl = document.getElementById('emptyState');
    document.getElementById('gridCount').textContent = list.length ? `${list.length}대` : '';

    if (list.length === 0){
      cardsEl.innerHTML = '';
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';

    // 저장된 드래그 순서가 있으면 그 순서로, 없으면 ONLINE 우선 + hostname 순
    const sorted = applyCustomOrder(list);

    cardsEl.innerHTML = sorted.map(serverCard).join('');
    attachDragHandlers();
  }

  function applyFilter(){
    const q = document.getElementById('search').value.trim().toLowerCase();
    const filtered = q ? allServers.filter(s => (s.hostname||'').toLowerCase().includes(q)) : allServers;
    render(filtered);
  }

  async function fetchData(){
    try {
      const [serversRes, summaryRes] = await Promise.all([
        fetch('/servers'),
        fetch('/servers/summary')
      ]);
      if (!serversRes.ok || !summaryRes.ok) {
        if (serversRes.status === 401 || summaryRes.status === 401) {
          window.location.href = '/login';
          return;
        }
        throw new Error('bad response');
      }

      allServers = await serversRes.json();
      const summary = await summaryRes.json();

      document.getElementById('sTotal').textContent = summary.total ?? 0;
      document.getElementById('sOnline').textContent = summary.online ?? 0;
      document.getElementById('sOffline').textContent = summary.offline ?? 0;
      document.getElementById('sCpu').innerHTML = (summary.avgCpu ?? 0).toFixed(1) + '<span class="unit">%</span>';
      document.getElementById('sMem').innerHTML = (summary.avgMemory ?? 0).toFixed(1) + '<span class="unit">%</span>';

      document.getElementById('errBanner').style.display = 'none';
      applyFilter();
    } catch (e) {
      document.getElementById('errBanner').style.display = 'block';
    }
  }

  function tickClock(){
    const d = new Date();
    const pad = n => String(n).padStart(2,'0');
    document.getElementById('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  document.getElementById('search').addEventListener('input', applyFilter);

  // 카드가 매번 innerHTML로 다시 그려지므로, 버튼에 직접 리스너를 붙이지 않고
  // 부모(#cards)에 위임해서 재렌더링 후에도 항상 동작하도록 처리
  document.getElementById('cards').addEventListener('click', (e) => {
    const btn = e.target.closest('.btn-delete');
    if (!btn) return;
    handleDelete(btn.dataset.hostname, btn);
  });

  async function handleDelete(hostname, btnEl){
    if (!hostname) return;
    const ok = confirm(`${hostname} 서버 데이터를 삭제할까요?\n(에이전트가 다시 데이터를 보내면 재등록됩니다)`);
    if (!ok) return;

    if (btnEl) { btnEl.disabled = true; btnEl.textContent = '삭제 중...'; }

    try {
      const res = await fetch(`/servers/${encodeURIComponent(hostname)}`, { method: 'DELETE' });
      let body = {};
      try { body = await res.json(); } catch (_) {}
      if (!res.ok) throw new Error(body.message || `삭제 실패 (HTTP ${res.status})`);

      await fetchData();
    } catch (e) {
      alert(`삭제 실패: ${e.message}`);
      if (btnEl) { btnEl.disabled = false; btnEl.textContent = '삭제'; }
    }
  }

  // ---- 드래그앤드롭으로 카드 순서 변경 ----
  let draggedCard = null;
  let isDragging = false;
  let pendingRenderList = null; // 드래그 중 들어온 최신 목록을 잠시 보관했다가, 드래그 종료 시 반영

  function attachDragHandlers(){
    const cardsEl = document.getElementById('cards');
    cardsEl.querySelectorAll('.card').forEach(card => {
      card.addEventListener('dragstart', handleDragStart);
      card.addEventListener('dragover', handleDragOver);
      card.addEventListener('dragleave', handleDragLeave);
      card.addEventListener('drop', handleDrop);
      card.addEventListener('dragend', handleDragEnd);
    });
  }

  function handleDragStart(e){
    // 삭제 버튼 클릭 시에는 드래그가 시작되지 않도록 방지
    if (e.target.closest('.btn-delete')) {
      e.preventDefault();
      return;
    }
    draggedCard = this;
    isDragging = true;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', this.dataset.hostname || '');
    // 브라우저가 드래그 이미지를 캡처한 뒤 스타일을 적용
    requestAnimationFrame(() => this.classList.add('dragging'));
  }

  function handleDragOver(e){
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if (this === draggedCard) return;
    this.classList.add('drag-over');
  }

  function handleDragLeave(){
    this.classList.remove('drag-over');
  }

  function handleDrop(e){
    e.preventDefault();
    this.classList.remove('drag-over');
    if (!draggedCard || this === draggedCard) return;

    const cardsEl = document.getElementById('cards');
    const cardsArr = Array.from(cardsEl.children);
    const fromIdx = cardsArr.indexOf(draggedCard);
    const toIdx = cardsArr.indexOf(this);

    if (fromIdx < toIdx) {
      this.after(draggedCard);
    } else {
      this.before(draggedCard);
    }

    saveCurrentOrderFromDom();
  }

  function handleDragEnd(){
    this.classList.remove('dragging');
    document.getElementById('cards').querySelectorAll('.card').forEach(c => c.classList.remove('drag-over'));
    draggedCard = null;
    isDragging = false;

    // 드래그하는 동안 자동 새로고침으로 들어온 최신 데이터를 이제 한 번에 반영
    // (검색 필터까지 함께 고려해서 다시 그림)
    pendingRenderList = null;
    applyFilter();
  }

  document.getElementById('resetOrder').addEventListener('click', () => {
    const ok = confirm('드래그로 변경한 카드 배치를 초기 상태(ONLINE 우선 + hostname 순)로 되돌릴까요?');
    if (!ok) return;
    customOrder = [];
    localStorage.removeItem(ORDER_KEY);
    applyFilter();
  });

  tickClock();
  setInterval(tickClock, 1000);
  fetchData();
  setInterval(fetchData, REFRESH_MS);

  // ---- 유휴시간 감지 후 자동 로그아웃 ----
  // /servers, /servers/summary 를 5초마다 자동으로 계속 호출하기 때문에,
  // 사람이 화면 앞을 떠나 있어도 서버 쪽 세션 타임아웃이 "활동 있음"으로 계속 리셋되어버림.
  // 그래서 서버 요청과는 별개로, 실제 마우스/키보드 조작이 일정 시간 없으면
  // 여기서 직접 로그아웃시켜서 진짜 "자리를 비웠을 때" 로그아웃되게 만든다.
  (function () {
    let idleTimeoutMs = 10 * 60 * 1000; // 서버 값을 못 받아오면 쓰는 기본값(10분)
    let lastActivityTime = Date.now();

    ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart', 'click'].forEach(evt => {
      document.addEventListener(evt, () => { lastActivityTime = Date.now(); }, { passive: true });
    });

    // 서버에 실제 적용된 세션 타임아웃 값(SESSIONVALUE, SystemEnvDao)을 받아와서
    // 클라이언트의 유휴시간 기준과 맞춤 (이 호출도 서버 세션 활동으로 잡히지만,
    // 페이지 로드 시 딱 한 번뿐이라 문제 없음)
    fetch('/session-info')
      .then(res => res.ok ? res.json() : null)
      .then(info => {
        if (info && info.maxInactiveIntervalSeconds) {
          idleTimeoutMs = info.maxInactiveIntervalSeconds * 1000;
        }
      })
      .catch(() => {});

    setInterval(() => {
      if (Date.now() - lastActivityTime >= idleTimeoutMs) {
        alert('장시간 활동이 없어 자동 로그아웃됩니다.');
        window.location.href = '/logout';
      }
    }, 15000); // 15초마다 유휴시간 체크
  })();
</script>

</body>
</html>
