<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 · 망연계</title>
<style>
  :root{
    --bg:#0a0e13;
    --panel:#11161d;
    --panel-2:#161c25;
    --line:#232b36;
    --text:#e7ecf3;
    --text-dim:#7f8ba0;
    --text-faint:#4d586b;
    --bad:#ff5d6c;
    --bad-dim:#3d1f24;
    --accent:#5b8cff;
    --disp:'Segoe UI', 'Noto Sans KR', 'Malgun Gothic', -apple-system, sans-serif;
    --mono:'Consolas', 'D2Coding', 'Noto Sans Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(91,140,255,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--mono);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
  }
  .box{
    width:100%;max-width:340px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:32px 28px;
  }
  .brand{
    display:flex;align-items:center;gap:8px;margin-bottom:24px;
  }
  .brand .dot{
    width:9px;height:9px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 8px var(--accent);
  }
  .brand h1{
    font-family:var(--disp);font-size:17px;font-weight:600;margin:0;color:var(--text);
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:11px;color:var(--text-dim);margin-bottom:6px;letter-spacing:.02em;
  }
  .field input{
    width:100%;padding:10px 12px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:6px;
    color:var(--text);font-family:var(--mono);font-size:13px;
    outline:none;transition:border-color .15s;
  }
  .field input:focus{border-color:var(--accent);}
  .submit{
    width:100%;margin-top:6px;padding:11px;
    background:var(--accent);border:none;border-radius:6px;
    color:#fff;font-family:var(--mono);font-size:13px;font-weight:600;
    cursor:pointer;transition:opacity .15s;
  }
  .submit:hover{opacity:.9;}
  .error{
    background:var(--bad-dim);border:1px solid var(--bad);color:var(--bad);
    padding:9px 12px;border-radius:6px;font-size:12px;margin-bottom:16px;
    display:none;
  }
  .error.show{display:block;}
</style>
</head>
<body>

<div class="box">
  <div class="brand">
    <div class="dot"></div>
    <h1>망연계 로그인</h1>
  </div>

  <div class="error" id="err">아이디 또는 비밀번호가 올바르지 않습니다.</div>

  <form method="post" action="/login" id="loginForm">
    <div class="field">
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="submit" id="submitBtn">로그인</button>
  </form>
</div>

<!-- 아이디/비밀번호를 RSA로 암호화해서 보내기 위한 라이브러리 -->
<script src="https://cdn.jsdelivr.net/npm/jsencrypt@3.3.2/bin/jsencrypt.min.js"></script>
<script>
  if (location.search.indexOf('error') > -1) {
    document.getElementById('err').classList.add('show');
  }

  // 서버가 기동할 때마다 새로 만드는 RSA 공개키를 미리 받아둠
  var publicKeyPem = null;
  fetch('/login/public-key')
    .then(function (res) { return res.text(); })
    .then(function (pem) { publicKeyPem = pem; })
    .catch(function (e) { console.error('공개키를 가져오지 못했습니다.', e); });

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();

    if (!publicKeyPem) {
      alert('로그인 준비 중입니다. 잠시 후 다시 시도해주세요.');
      return;
    }

    var usernameEl = document.getElementById('username');
    var passwordEl = document.getElementById('password');
    var submitBtn = document.getElementById('submitBtn');

    var encryptor = new JSEncrypt();
    encryptor.setPublicKey(publicKeyPem);

    var encryptedUsername = encryptor.encrypt(usernameEl.value);
    var encryptedPassword = encryptor.encrypt(passwordEl.value);

    if (!encryptedUsername || !encryptedPassword) {
      alert('로그인 정보를 암호화하지 못했습니다. 다시 시도해주세요.');
      return;
    }

    // 화면에 보이는 입력값을 암호화된 값으로 교체한 뒤 제출
    // (서버는 이 값을 그대로 받아 개인키로 복호화함 - RsaLoginAuthenticationFilter)
    usernameEl.value = encryptedUsername;
    passwordEl.value = encryptedPassword;

    submitBtn.disabled = true;
    submitBtn.textContent = '로그인 중...';

    e.target.submit();
  });
</script>
</body>
</html>
