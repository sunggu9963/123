<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 · 망연계</title>
  <style>
    :root{
      --bg:#0a0e13;
      --panel:#11161d;
      --panel-2:#161c25;
      --line:#232b36;
      --text:#e7ecf3;
      --text-dim:#7f8ba0;
      --text-faint:#4d586b;
      --bad:#ff5d6c;
      --bad-dim:#3d1f24;
      --accent:#5b8cff;
      --disp:'Segoe UI', 'Noto Sans KR', 'Malgun Gothic', -apple-system, sans-serif;
      --mono:'Consolas', 'D2Coding', 'Noto Sans Mono', 'Courier New', monospace;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;height:100%;}
    body{
      background:
        radial-gradient(1200px 500px at 15% -10%, rgba(91,140,255,0.10), transparent 60%),
        var(--bg);
      color:var(--text);
      font-family:var(--mono);
      min-height:100vh;
      display:flex;align-items:center;justify-content:center;
    }
    .box{
      width:100%;max-width:340px;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:10px;
      padding:32px 28px;
    }
    .brand{
      display:flex;align-items:center;gap:8px;margin-bottom:24px;
    }
    .brand .dot{
      width:9px;height:9px;border-radius:50%;background:var(--accent);
      box-shadow:0 0 8px var(--accent);
    }
    .brand h1{
      font-family:var(--disp);font-size:17px;font-weight:600;margin:0;color:var(--text);
    }
    .field{margin-bottom:14px;}
    .field label{
      display:block;font-size:11px;color:var(--text-dim);margin-bottom:6px;letter-spacing:.02em;
    }
    .field input{
      width:100%;padding:10px 12px;
      background:var(--panel-2);border:1px solid var(--line);border-radius:6px;
      color:var(--text);font-family:var(--mono);font-size:13px;
      outline:none;transition:border-color .15s;
    }
    .field input:focus{border-color:var(--accent);}
    .submit{
      width:100%;margin-top:6px;padding:11px;
      background:var(--accent);border:none;border-radius:6px;
      color:#fff;font-family:var(--mono);font-size:13px;font-weight:600;
      cursor:pointer;transition:opacity .15s;
    }
    .submit:hover{opacity:.9;}
    .error{
      background:var(--bad-dim);border:1px solid var(--bad);color:var(--bad);
      padding:9px 12px;border-radius:6px;font-size:12px;margin-bottom:16px;
      display:none;
    }
    .error.show{display:block;}
  </style>
</head>
<body>

<div class="box">
  <div class="brand">
    <div class="dot"></div>
    <h1>망연계 로그인</h1>
  </div>

  <div class="error" id="err">아이디 또는 비밀번호가 올바르지 않습니다.</div>

  <form method="post" action="/login" id="loginForm">
    <div class="field">
      <label for="username">아이디</label>
      <!-- 사용자가 보고 입력하는 필드 - name을 안 줘서 이 필드 자체는 전송되지 않음 -->
      <input type="text" id="username" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <!-- 실제로 서버에 전송되는 건 이 숨김 필드들 (암호화된 값이 여기에 담김) -->
    <input type="hidden" id="encUsername" name="username">
    <input type="hidden" id="encPassword" name="password">
    <button type="submit" class="submit" id="submitBtn">로그인</button>
  </form>
</div>

<!-- 아이디/비밀번호를 RSA로 암호화해서 보내기 위한 라이브러리 -->
<script src="https://cdn.jsdelivr.net/npm/jsencrypt@3.3.2/bin/jsencrypt.min.js"></script>
<script>
  if (location.search.indexOf('error') > -1) {
    document.getElementById('err').classList.add('show');
  }

  var submitBtn = document.getElementById('submitBtn');

  // 뒤로가기/새로고침으로 페이지가 캐시에서 복원될 때(bfcache)도 호출됨.
  // 이전에 눌러놨던 "로그인 중..." 비활성화 상태가 그대로 남아있는 것을 방지.
  window.addEventListener('pageshow', function () {
    submitBtn.disabled = false;
    submitBtn.textContent = '로그인';
    document.getElementById('encUsername').value = '';
    document.getElementById('encPassword').value = '';
  });

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();

    var usernameEl = document.getElementById('username');
    var passwordEl = document.getElementById('password');

    submitBtn.disabled = true;
    submitBtn.textContent = '로그인 중...';

    // 공개키는 페이지 로드 시점이 아니라 "제출하는 바로 이 순간"에 매번 새로 받아온다.
    // 서버는 재시작될 때마다 새 RSA 키쌍을 만들기 때문에, 로그인 페이지를 오래 열어두고
    // 있다가 그 사이 서버가 재시작(배포 등)됐다면 페이지 로드 시점에 캐시해둔 공개키는
    // 이미 무효한 값이 된다. 매번 새로 받아오면 이 문제가 원천적으로 생기지 않는다.
    fetch('/login/public-key')
      .then(function (res) {
        if (!res.ok) {
          throw new Error('공개키 응답 오류: ' + res.status);
        }
        return res.text();
      })
      .then(function (publicKeyPem) {
        var encryptor = new JSEncrypt();
        encryptor.setPublicKey(publicKeyPem);

        var encryptedUsername = encryptor.encrypt(usernameEl.value);
        var encryptedPassword = encryptor.encrypt(passwordEl.value);

        if (!encryptedUsername || !encryptedPassword) {
          throw new Error('암호화 실패');
        }

        // 화면에 보이는 입력창(usernameEl/passwordEl)은 건드리지 않고,
        // 실제 전송용 숨김 필드에만 암호화된 값을 채워서 제출
        // (서버는 이 값을 그대로 받아 개인키로 복호화함 - RsaLoginAuthenticationFilter)
        document.getElementById('encUsername').value = encryptedUsername;
        document.getElementById('encPassword').value = encryptedPassword;

        e.target.submit();
      })
      .catch(function (err) {
        console.error('로그인 준비 중 오류가 발생했습니다.', err);
        alert('로그인 준비 중 오류가 발생했습니다. 새로고침 후 다시 시도해주세요.');
        submitBtn.disabled = false;
        submitBtn.textContent = '로그인';
      });
  });
</script>
</body>
</html>
