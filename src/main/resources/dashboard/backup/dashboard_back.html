<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mycollector · 서버 관제</title>
<style>
  :root{
    --bg:#0a0e13;
    --panel:#11161d;
    --panel-2:#161c25;
    --line:#232b36;
    --text:#e7ecf3;
    --text-dim:#7f8ba0;
    --text-faint:#4d586b;
    --ok:#35d68e;
    --ok-dim:#1b3d30;
    --bad:#ff5d6c;
    --bad-dim:#3d1f24;
    --warn:#ffb648;
    --warn-dim:#3a2c14;
    --accent:#5b8cff;
    /* 인터넷 접근이 없는 폐쇄망 환경을 고려해 웹폰트(CDN) 대신
       OS에 기본 내장된 폰트만으로 스택을 구성 (Win/macOS/Linux 공통 폴백) */
    --disp:'Segoe UI', 'Noto Sans KR', 'Malgun Gothic', -apple-system, sans-serif;
    --mono:'Consolas', 'D2Coding', 'Noto Sans Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(91,140,255,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--mono);
    min-height:100vh;
  }
  ::selection{background:var(--accent);color:#fff;}

  /* ---------- top bar ---------- */
  header{
    position:sticky;top:0;z-index:10;
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;
    padding:18px 28px;
    background:rgba(10,14,19,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--ok);
    box-shadow:0 0 0 0 rgba(53,214,142,.6);
    animation:brandpulse 2.4s ease-out infinite;
  }
  @keyframes brandpulse{
    0%{box-shadow:0 0 0 0 rgba(53,214,142,.55);}
    70%{box-shadow:0 0 0 9px rgba(53,214,142,0);}
    100%{box-shadow:0 0 0 0 rgba(53,214,142,0);}
  }
  .brand h1{
    font-family:var(--disp);
    font-size:18px;font-weight:700;letter-spacing:.2px;margin:0;
  }
  .brand span{color:var(--text-dim);font-size:12px;font-family:var(--mono);}

  .toolbar{display:flex;align-items:center;gap:10px;}
  #search{
    background:var(--panel);border:1px solid var(--line);
    color:var(--text);padding:8px 12px;border-radius:6px;
    font-family:var(--mono);font-size:13px;width:220px;
    outline:none;transition:border-color .15s;
  }
  #search:focus{border-color:var(--accent);}
  #search::placeholder{color:var(--text-faint);}

  .clock{color:var(--text-dim);font-size:12px;min-width:150px;text-align:right;}

  /* ---------- summary strip ---------- */
  .summary{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:1px;
    background:var(--line);
    border-bottom:1px solid var(--line);
  }
  .summary .cell{
    background:var(--bg);
    padding:20px 28px;
  }
  .summary .cell .label{
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-faint);margin-bottom:8px;
  }
  .summary .cell .value{
    font-family:var(--disp);font-size:30px;font-weight:700;line-height:1;
  }
  .summary .cell .value.ok{color:var(--ok);}
  .summary .cell .value.bad{color:var(--bad);}
  .summary .cell .unit{font-size:14px;color:var(--text-dim);margin-left:4px;font-family:var(--mono);font-weight:400;}

  /* ---------- main grid ---------- */
  main{padding:24px 28px 60px;max-width:1400px;margin:0 auto;}
  .grid-title{
    display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;
  }
  .grid-title h2{
    font-family:var(--disp);font-size:14px;font-weight:500;
    color:var(--text-dim);letter-spacing:.04em;text-transform:uppercase;margin:0;
  }
  .grid-title .count{color:var(--text-faint);font-size:12px;}

  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:14px;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px;
    position:relative;
    overflow:hidden;
    transition:border-color .15s, transform .15s;
  }
  .card:hover{border-color:#2e3a49;}
  .card.offline{opacity:.62;}
  .card::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  }
  .card.online::before{background:var(--ok);}
  .card.offline::before{background:var(--bad);}

  .card-head{
    display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;
  }
  .card-head h3{
    font-family:var(--disp);font-size:16px;font-weight:700;margin:0 0 3px;
    color:var(--text);word-break:break-all;
  }
  .card-head .ip{color:var(--text-dim);font-size:12px;}

  .badge{
    display:flex;align-items:center;gap:6px;
    font-size:11px;font-weight:700;letter-spacing:.06em;
    padding:4px 9px;border-radius:20px;white-space:nowrap;
  }
  .badge.online{background:var(--ok-dim);color:var(--ok);}
  .badge.offline{background:var(--bad-dim);color:var(--bad);}

  .heartbeat{width:16px;height:10px;flex:none;}
  .heartbeat path{
    fill:none;stroke:var(--ok);stroke-width:1.4;
    stroke-dasharray:24;stroke-dashoffset:24;
    animation:beat 1.8s linear infinite;
  }
  @keyframes beat{
    0%{stroke-dashoffset:24;}
    60%{stroke-dashoffset:0;}
    100%{stroke-dashoffset:-24;}
  }

  .metric-row{margin-bottom:10px;}
  .metric-row .metric-label{
    display:flex;justify-content:space-between;
    font-size:11px;color:var(--text-dim);margin-bottom:5px;
  }
  .metric-label b{color:var(--text);font-family:var(--mono);font-weight:700;}
  .bar-track{
    height:6px;border-radius:4px;background:#1c2330;overflow:hidden;
  }
  .bar-fill{height:100%;border-radius:4px;transition:width .4s ease;}
  .bar-fill.g{background:var(--ok);}
  .bar-fill.y{background:var(--warn);}
  .bar-fill.r{background:var(--bad);}

  .disk-list{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
  .disk-item{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:11px;}
  .disk-item .mp{width:72px;color:var(--text-dim);flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .disk-item .bar-track{flex:1;}
  .disk-item .pct{width:38px;text-align:right;flex:none;color:var(--text-dim);}

  .proc-list{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:6px;}
  .proc-pill{
    font-size:10.5px;padding:3px 8px;border-radius:5px;
    display:flex;align-items:center;gap:5px;
    background:var(--panel-2);color:var(--text-dim);border:1px solid var(--line);
  }
  .proc-pill .dot{width:6px;height:6px;border-radius:50%;flex:none;}
  .proc-pill.up .dot{background:var(--ok);}
  .proc-pill.down .dot{background:var(--bad);}
  .proc-pill.down{color:var(--bad);border-color:var(--bad-dim);}

  .card-foot{
    display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;
    border-top:1px solid var(--line);font-size:10.5px;color:var(--text-faint);
  }
  .card-foot .ttl.warn{color:var(--warn);}

  .empty{
    text-align:center;padding:80px 20px;color:var(--text-faint);
  }
  .empty .big{font-family:var(--disp);font-size:20px;color:var(--text-dim);margin-bottom:8px;}
  .empty code{color:var(--accent);background:var(--panel);padding:2px 6px;border-radius:4px;}

  .err-banner{
    background:var(--bad-dim);border:1px solid var(--bad);color:var(--bad);
    padding:10px 16px;border-radius:6px;font-size:12px;margin-bottom:16px;display:none;
  }

  @media (prefers-reduced-motion: reduce){
    .brand .dot, .heartbeat path{animation:none;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="dot"></div>
    <h1>MYCOLLECTOR</h1>
    <span>서버 상태 관제</span>
  </div>
  <div class="toolbar">
    <input id="search" type="text" placeholder="hostname 검색...">
    <div class="clock" id="clock">--:--:--</div>
  </div>
</header>

<section class="summary">
  <div class="cell">
    <div class="label">전체 서버</div>
    <div class="value" id="sTotal">–</div>
  </div>
  <div class="cell">
    <div class="label">Online</div>
    <div class="value ok" id="sOnline">–</div>
  </div>
  <div class="cell">
    <div class="label">Offline</div>
    <div class="value bad" id="sOffline">–</div>
  </div>
  <div class="cell">
    <div class="label">평균 CPU</div>
    <div class="value" id="sCpu">–<span class="unit">%</span></div>
  </div>
  <div class="cell">
    <div class="label">평균 메모리</div>
    <div class="value" id="sMem">–<span class="unit">%</span></div>
  </div>
</section>

<main>
  <div class="err-banner" id="errBanner">서버 목록을 불러오지 못했습니다. API 서버 연결 상태를 확인하세요.</div>

  <div class="grid-title">
    <h2>Servers</h2>
    <span class="count" id="gridCount"></span>
  </div>

  <div class="cards" id="cards"></div>

  <div class="empty" id="emptyState" style="display:none;">
    <div class="big">등록된 서버가 없습니다</div>
    <div>에이전트가 <code>POST /collect.do</code> 로 데이터를 전송하면 여기에 표시됩니다.</div>
  </div>
</main>

<script>
const REFRESH_MS = 5000;
const CPU_WARN = 80, CPU_BAD = 90;
const MEM_WARN = 85, MEM_BAD = 95;
const DISK_WARN = 80, DISK_BAD = 90;

let allServers = [];

function heartbeatSvg(){
  return `<svg class="heartbeat" viewBox="0 0 32 20"><path d="M0 10 H8 L11 3 L15 17 L18 10 H32"/></svg>`;
}

function barClass(v, warn, bad){
  if (v >= bad) return 'r';
  if (v >= warn) return 'y';
  return 'g';
}

function fmtTtl(sec){
  if (sec == null || sec < 0) return 'expired';
  const m = Math.floor(sec/60), s = sec%60;
  return m > 0 ? `${m}m ${s}s` : `${s}s`;
}

function serverCard(s){
  const online = s.status === 'ONLINE';
  const cpu = s.cpuUsage ?? 0, mem = s.memoryUsage ?? 0;

  const diskHtml = (s.diskUsages || []).map(d => {
    const u = d.usage ?? 0;
    return `
      <div class="disk-item">
        <div class="mp" title="${d.mountPoint ?? ''}">${d.mountPoint ?? '-'}</div>
        <div class="bar-track"><div class="bar-fill ${barClass(u, DISK_WARN, DISK_BAD)}" style="width:${Math.min(u,100)}%"></div></div>
        <div class="pct">${u.toFixed(0)}%</div>
      </div>`;
  }).join('');

  const procHtml = (s.processes || []).map(p => {
    const up = !!p.running;
    return `<div class="proc-pill ${up?'up':'down'}"><span class="dot"></span>${p.name}</div>`;
  }).join('');

  const ttl = s.remainingTtl;
  const ttlWarnClass = (online && ttl >= 0 && ttl < 15) ? 'warn' : '';

  return `
  <div class="card ${online ? 'online':'offline'}" data-hostname="${(s.hostname||'').toLowerCase()}">
    <div class="card-head">
      <div>
        <h3>${s.hostname ?? '-'}</h3>
        <div class="ip">${s.ip ?? '-'}</div>
      </div>
      <div class="badge ${online?'online':'offline'}">
        ${online ? heartbeatSvg() : ''}
        ${online ? 'ONLINE' : 'OFFLINE'}
      </div>
    </div>

    <div class="metric-row">
      <div class="metric-label"><span>CPU</span><b>${cpu.toFixed(1)}%</b></div>
      <div class="bar-track"><div class="bar-fill ${barClass(cpu, CPU_WARN, CPU_BAD)}" style="width:${Math.min(cpu,100)}%"></div></div>
    </div>
    <div class="metric-row">
      <div class="metric-label"><span>Memory</span><b>${mem.toFixed(1)}%</b></div>
      <div class="bar-track"><div class="bar-fill ${barClass(mem, MEM_WARN, MEM_BAD)}" style="width:${Math.min(mem,100)}%"></div></div>
    </div>

    ${diskHtml ? `<div class="disk-list">${diskHtml}</div>` : ''}
    ${procHtml ? `<div class="proc-list">${procHtml}</div>` : ''}

    <div class="card-foot">
      <span>${s.getLastSeenFormatted ?? formatTs(s.timestamp)}</span>
      <span class="ttl ${ttlWarnClass}">TTL ${online ? fmtTtl(ttl) : '-'}</span>
    </div>
  </div>`;
}

function formatTs(ts){
  if (!ts) return '-';
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function render(list){
  const cardsEl = document.getElementById('cards');
  const emptyEl = document.getElementById('emptyState');
  document.getElementById('gridCount').textContent = list.length ? `${list.length}대` : '';

  if (list.length === 0){
    cardsEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  // ONLINE 우선 정렬, 그 다음 hostname
  const sorted = [...list].sort((a,b) => {
    if ((a.status==='ONLINE') !== (b.status==='ONLINE')) return a.status==='ONLINE' ? -1 : 1;
    return (a.hostname||'').localeCompare(b.hostname||'');
  });

  cardsEl.innerHTML = sorted.map(serverCard).join('');
}

function applyFilter(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filtered = q ? allServers.filter(s => (s.hostname||'').toLowerCase().includes(q)) : allServers;
  render(filtered);
}

async function fetchData(){
  try {
    const [serversRes, summaryRes] = await Promise.all([
      fetch('/servers'),
      fetch('/servers/summary')
    ]);
    if (!serversRes.ok || !summaryRes.ok) throw new Error('bad response');

    allServers = await serversRes.json();
    const summary = await summaryRes.json();

    document.getElementById('sTotal').textContent = summary.total ?? 0;
    document.getElementById('sOnline').textContent = summary.online ?? 0;
    document.getElementById('sOffline').textContent = summary.offline ?? 0;
    document.getElementById('sCpu').innerHTML = (summary.avgCpu ?? 0).toFixed(1) + '<span class="unit">%</span>';
    document.getElementById('sMem').innerHTML = (summary.avgMemory ?? 0).toFixed(1) + '<span class="unit">%</span>';

    document.getElementById('errBanner').style.display = 'none';
    applyFilter();
  } catch (e) {
    document.getElementById('errBanner').style.display = 'block';
  }
}

function tickClock(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

document.getElementById('search').addEventListener('input', applyFilter);

tickClock();
setInterval(tickClock, 1000);
fetchData();
setInterval(fetchData, REFRESH_MS);
</script>

</body>
</html>
